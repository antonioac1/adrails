[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adrails"
version = "0.5.0"
description = "AdRails: open-source MCP server for AI agents running ad accounts with guardrails: Google Ads changes through plan/validate/commit, enterprise controls, AEO toolkit and direct-mail tracking."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "adsops contributors" }]
keywords = ["mcp", "mcp-server", "google-ads", "ai-agents", "guardrails", "aeo", "direct-mail", "qr-code", "llms-txt", "advertising"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
google = ["google-auth>=2.0"]

[project.urls]
Homepage = "https://adrails.dev"
Source = "https://github.com/antonioac1/adrails"

[project.scripts]
adrails = "adsops.__main__:main"
adsops-mcp = "adsops.__main__:main"

[tool.setuptools.packages.find]
include = ["adsops*"]

[tool.setuptools.package-data]
adsops = ["fixtures/*.json", "intel/fixtures/*.csv", "intel/fixtures/*.tsv", "intel/fixtures/*.txt", "intel/fixtures/*.json"]
